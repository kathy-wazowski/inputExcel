<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .animated-square {
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            animation: moveRight 5s infinite linear;
        }

        @keyframes moveRight {
            0% {
                left: 0;
            }
            100% {
                left: calc(100% - 100px);
            }
        }
    </style>
</head>
<body>
    Hello, World!
    <div class="animated-square"></div>
</body>
</html>
